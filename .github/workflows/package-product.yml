name: Package ArcPy Project Starter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-product.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build product ZIP
        run: |
          set -euo pipefail
          mkdir -p dist stage/arcpy-project-starter
          rsync -a \
            --exclude='.git/' \
            --exclude='dist/' \
            --exclude='stage/' \
            --exclude='.github/workflows/package-product.yml' \
            ./ stage/arcpy-project-starter/
          (cd stage && zip -qr ../dist/arcpy-project-starter-v1.0.0.zip arcpy-project-starter)
          python3 -m zipfile -t dist/arcpy-project-starter-v1.0.0.zip
          sha256sum dist/arcpy-project-starter-v1.0.0.zip

      - name: Upload product artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcpy-project-starter-v1.0.0
          path: dist/arcpy-project-starter-v1.0.0.zip
          if-no-files-found: error
          retention-days: 1
